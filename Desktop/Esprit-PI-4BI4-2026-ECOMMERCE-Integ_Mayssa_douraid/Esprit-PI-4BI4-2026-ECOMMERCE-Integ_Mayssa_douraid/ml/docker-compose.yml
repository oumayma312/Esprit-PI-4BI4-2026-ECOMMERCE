services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      PGHOST: ${PGHOST}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      DW_SCHEMA: ${DW_SCHEMA:-datawarehouse}
      ML_SCHEMA: ${ML_SCHEMA:-ml}
      ML_SUPPLIER_TABLE: ${ML_SUPPLIER_TABLE:-supplier_clusters}
      ML_SELL_TABLE: ${ML_SELL_TABLE:-best_time_to_sell_monthly}
      ML_PROMOTE_TABLE: ${ML_PROMOTE_TABLE:-best_time_to_promote_monthly}
      SUPPLIER_MODEL_PATH: ${SUPPLIER_MODEL_PATH:-models/supplier_clustering_model.pkl}
      SELL_MODEL_PATH: ${SELL_MODEL_PATH:-models/best_time_to_sell_model.pkl}
      PROMOTE_MODEL_PATH: ${PROMOTE_MODEL_PATH:-models/best_time_to_promote_model.pkl}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: supplier_clustering
      MLFLOW_PROMOTE_EXPERIMENT_NAME: ${MLFLOW_PROMOTE_EXPERIMENT_NAME:-promote-forecasting}
      MLFLOW_PROMOTE_MODEL_NAME: ${MLFLOW_PROMOTE_MODEL_NAME:-promote-demand-forecaster}
      MLFLOW_CAMPAIGN_EXPERIMENT_NAME: ${MLFLOW_CAMPAIGN_EXPERIMENT_NAME:-campaign-analytics}
      MLFLOW_CAMPAIGN_CLASSIFIER_MODEL_NAME: ${MLFLOW_CAMPAIGN_CLASSIFIER_MODEL_NAME:-campaign-success-classifier}
      MLFLOW_CAMPAIGN_REGRESSOR_MODEL_NAME: ${MLFLOW_CAMPAIGN_REGRESSOR_MODEL_NAME:-campaign-kpi-regressor}
      MLFLOW_CAMPAIGN_CLUSTERING_MODEL_NAME: ${MLFLOW_CAMPAIGN_CLUSTERING_MODEL_NAME:-campaign-segmentation-kmeans}
    volumes:
      - .:/app
      - mlruns:/app/mlruns
      - mlartifacts:/app/mlartifacts
    depends_on:
      - mlflow

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: python flask_app.py
    ports:
      - "3001:3000"
    environment:
      FASTAPI_BASE_URL: http://api:8000
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 3000
      PGHOST: ${PGHOST}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
    volumes:
      - .:/app
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    extra_hosts:
      - "localhost:host-gateway"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api

  grafana:
    image: grafana/grafana-oss:11.1.4
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    command: mlflow server --backend-store-uri file:/mlruns --default-artifact-root /mlruns --host 0.0.0.0 --port 5000 --allowed-hosts "localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,mlflow,mlflow:5000,host.docker.internal"
    ports:
      - "5000:5000"
    volumes:
      - mlruns:/mlruns
      - mlartifacts:/mlartifacts
      - .:/app

volumes:
  mlruns:
  mlartifacts:
  prometheus-data:
  grafana-data:
