<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title if title else 'ML Web App' }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <script defer src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <script defer src="{{ url_for('static', filename='app.js') }}"></script>
  </head>
  <body>
    <div class="bg"></div>
    <div class="scrim"></div>

    <header class="navbar">
      <div class="navwrap">
        <a class="nbrand" href="/" data-nav>
          <img class="nbrand-logo" src="/img/logo.png" alt="Logo" />
          <span class="nbrand-text">PI BI ML</span>
        </a>

        <button class="navtoggle" type="button" data-nav-toggle aria-label="Toggle navigation">
          <span class="ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
          </span>
        </button>

        <nav class="nnav" id="nnav">
          <a class="nnav-item {{ 'is-active' if request.path=='/' else '' }}" href="/" data-nav>Dashboard</a>
          <a class="nnav-item {{ 'is-active' if request.path.startswith('/supplier') else '' }}" href="/supplier-classification" data-nav>Supplier</a>
          <a class="nnav-item {{ 'is-active' if request.path.startswith('/best-time-to-sell') else '' }}" href="/best-time-to-sell" data-nav>Best Time To Sell</a>
          <a class="nnav-item {{ 'is-active' if request.path.startswith('/best-time-to-promote') else '' }}" href="/best-time-to-promote" data-nav>Best Time To Promote</a>
        </nav>
      </div>
    </header>

    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
