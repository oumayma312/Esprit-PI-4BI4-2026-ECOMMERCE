{% extends 'base.html' %}

{% block content %}
<style>
  .chatbot-container {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .chatbot-header {
    margin-bottom: 2rem;
  }

  .chatbot-header h1 {
    margin: 0 0 0.5rem 0;
    font-size: 2rem;
    color: var(--ink);
  }

  .chatbot-header p {
    margin: 0;
    color: var(--ink-2);
    font-size: 0.95rem;
  }

  .chatbot-box {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .msg {
    padding: 0.85rem 1rem;
    border-radius: 8px;
    max-width: 70%;
    word-wrap: break-word;
    white-space: pre-wrap;
    line-height: 1.5;
  }

  .msg.bot {
    align-self: flex-start;
    background: #f0f4f8;
    color: var(--ink);
    border: 1px solid var(--line);
  }

  .msg.user {
    align-self: flex-end;
    background: var(--nav);
    color: #fff;
  }

  .msg.loading {
    color: var(--ink-2);
    font-style: italic;
  }

  .chatbot-form {
    display: flex;
    gap: 0.75rem;
    padding: 1.5rem;
    border-top: 1px solid var(--line);
    background: #fafbfc;
  }

  #prompt {
    flex: 1;
    padding: 0.75rem 1rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--ink);
  }

  #prompt:focus {
    outline: none;
    border-color: var(--nav);
    box-shadow: 0 0 0 2px rgba(18, 35, 158, 0.1);
  }

  .btn-send {
    padding: 0.75rem 1.5rem;
    background: var(--nav);
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: background 200ms ease;
  }

  .btn-send:hover {
    background: #0d1a7e;
  }

  .btn-send:active {
    transform: scale(0.98);
  }

  @media (max-width: 768px) {
    .chatbot-container {
      padding: 1rem;
    }

    .msg {
      max-width: 85%;
    }

    .chatbot-header h1 {
      font-size: 1.5rem;
    }
  }
</style>

<div class="chatbot-container">
  <div class="chatbot-header">
    <h1>Marketing Chatbot</h1>
    <p>Pose des questions sur tes produits, ventes et strategies marketing.</p>
  </div>

  <div class="chatbot-box">
    <div id="messages"></div>
    <form id="chat-form" class="chatbot-form">
      <input
        id="prompt"
        type="text"
        placeholder="Posez une question marketing..."
        autocomplete="off"
      />
      <button class="btn-send" type="submit">Envoyer</button>
    </form>
  </div>
</div>

<script>
  const messages = document.getElementById("messages");
  const form = document.getElementById("chat-form");
  const promptInput = document.getElementById("prompt");

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  // Initial greeting
  addMessage("bot", "Bonjour! Je peux analyser tes donnees et te proposer des recommandations marketing. Vous pouvez demander: top produits, produits a promouvoir, ou une strategie globale.");

  let isLoading = false;

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const prompt = promptInput.value.trim();
    if (!prompt || isLoading) return;

    addMessage("user", prompt);
    promptInput.value = "";

    isLoading = true;
    const loadingMsg = addMessage("bot", "En attente de reponse...");

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: prompt })
      });

      const data = await response.json();
      
      // Remove loading message
      messages.removeChild(messages.lastChild);
      
      // Add actual response
      addMessage("bot", data.reply || "Aucune reponse.");
    } catch (error) {
      addMessage("bot", "Erreur reseau. Verifiez le serveur Flask.");
      console.error(error);
    } finally {
      isLoading = false;
    }
  });
</script>
{% endblock %}
