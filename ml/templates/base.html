<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}ML Dashboard{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
  </head>
  <body>
    <div class="shell">
      <nav class="top-nav reveal">
        <div class="brand">
          <img src="{{ url_for('logo') }}" alt="Logo" />
          <span>ML Dashboard</span>
        </div>
        <div class="nav-links">
          <a class="nav-link {{ 'active' if active_page == 'home' else '' }}" href="{{ url_for('index') }}" data-nav="true">Accueil</a>
          <a class="nav-link {{ 'active' if active_page == 'promote' else '' }}" href="{{ url_for('promote') }}" data-nav="true">Promote</a>
          <a class="nav-link {{ 'active' if active_page == 'campaign' else '' }}" href="{{ url_for('campaign') }}" data-nav="true">Campaign</a>
          <a class="nav-link {{ 'active' if active_page == 'sougui' else '' }}" href="{{ url_for('sougui') }}" data-nav="true">Sougui</a>
        </div>
      </nav>

      {% block content %}{% endblock %}
    </div>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
