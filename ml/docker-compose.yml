services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      PGHOST: ${PGHOST}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      DW_SCHEMA: ${DW_SCHEMA:-datawarehouse}
      ML_SCHEMA: ${ML_SCHEMA:-ml}
      ML_SUPPLIER_TABLE: ${ML_SUPPLIER_TABLE:-supplier_clusters}
      ML_SELL_TABLE: ${ML_SELL_TABLE:-best_time_to_sell_monthly}
      ML_PROMOTE_TABLE: ${ML_PROMOTE_TABLE:-best_time_to_promote_monthly}
      SUPPLIER_MODEL_PATH: ${SUPPLIER_MODEL_PATH:-supplier_clustering_model.pkl}
      SELL_MODEL_PATH: ${SELL_MODEL_PATH:-best_time_to_sell_model.pkl}
      PROMOTE_MODEL_PATH: ${PROMOTE_MODEL_PATH:-best_time_to_promote_model.pkl}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: supplier_clustering
    volumes:
      - .:/app
      - mlruns:/app/mlruns
      - mlartifacts:/app/mlartifacts
    depends_on:
      - mlflow

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    command: mlflow server --backend-store-uri file:/mlruns --default-artifact-root /mlruns --host 0.0.0.0 --port 5000 --allowed-hosts "localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,mlflow,mlflow:5000,host.docker.internal"
    ports:
      - "5000:5000"
    volumes:
      - mlruns:/mlruns
      - mlartifacts:/mlartifacts
      - .:/app

volumes:
  mlruns:
  mlartifacts:
