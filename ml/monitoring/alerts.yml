groups:
  - name: sougui-api-alerts
    rules:
      - alert: HighLatency
        expr: histogram_quantile(0.95, sum by (le, handler) (rate(http_request_duration_seconds_bucket[5m]))) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Endpoint latency above 2 seconds"
          description: "The 95th percentile latency is above 2 seconds on {{ $labels.handler }}."

      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "API error rate above 5%"
          description: "The error rate for the API is above 5% over the last 5 minutes."

      - alert: ModelPrecisionDrop
        expr: ml_drift_metric_value{model="supplier_clustering",metric="precision_drop_ratio"} > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Supplier model quality dropped"
          description: "The supplier clustering quality dropped by more than 5%."

      - alert: DriftDetected
        expr: ml_drift_metric_value{model="supplier_clustering",metric="detected"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Supplier drift detected"
          description: "The supplier clustering drift checks flagged a drift condition."

  - name: sougui-model-alerts
    rules:
      # -- Sell drift alerts --

      - alert: SellAccuracyDrop
        expr: ml_drift_metric_value{model="best_time_to_sell",metric="accuracy_drop_ratio"} > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sell model accuracy dropped"
          description: "The best-time-to-sell model accuracy dropped by more than 5%."

      - alert: SellDriftDetected
        expr: ml_drift_metric_value{model="best_time_to_sell",metric="detected"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Sell drift detected"
          description: "The best-time-to-sell drift checks flagged a drift condition."

      # -- Promote drift alerts --

      - alert: PromoteAccuracyDrop
        expr: ml_drift_metric_value{model="best_time_to_promote",metric="accuracy_drop_ratio"} > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Promote model accuracy dropped"
          description: "The best-time-to-promote model accuracy dropped by more than 5%."

      - alert: PromoteDriftDetected
        expr: ml_drift_metric_value{model="best_time_to_promote",metric="detected"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Promote drift detected"
          description: "The best-time-to-promote drift checks flagged a drift condition."

      # -- Churn drift alerts --

      - alert: ChurnAccuracyDrop
        expr: ml_drift_metric_value{model="churn_prediction",metric="accuracy_drop_ratio"} > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Churn model accuracy dropped"
          description: "The churn prediction model accuracy dropped by more than 5%."

      - alert: ChurnDriftDetected
        expr: ml_drift_metric_value{model="churn_prediction",metric="detected"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Churn drift detected"
          description: "The churn prediction drift checks flagged a drift condition."

      - alert: HighChurnRiskRate
        expr: ml_model_metric_value{model="churn_prediction",metric="high_risk_rate"} > 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High churn risk rate detected"
          description: "More than 30% of recent predictions are high-risk customers."
