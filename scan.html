<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sougui Scan Demo</title>
  <style>
    body{
      font-family:Arial,sans-serif;
      max-width:1100px;
      margin:2rem auto;
      padding:0 1rem;
      background:#f7f7f7;
      color:#222;
    }

    h1{
      margin-bottom:0.5rem;
    }

    .top-box{
      background:#fff;
      border:1px solid #e5e5e5;
      border-radius:14px;
      padding:18px;
      margin-bottom:24px;
    }

    button{
      padding:.8rem 1rem;
      font-size:1rem;
      border:none;
      border-radius:10px;
      background:#111827;
      color:#fff;
      cursor:pointer;
    }

    button:hover{
      opacity:.92;
    }

    #preview{
      max-width:100%;
      max-height:320px;
      display:block;
      margin:1rem 0;
      border-radius:12px;
    }

    #status{
      margin-top:12px;
      font-size:15px;
    }

    .results-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
      gap:18px;
      margin-top:18px;
    }

    .product-card{
      background:#fff;
      border:1px solid #e5e5e5;
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 4px 14px rgba(0,0,0,0.06);
      display:flex;
      flex-direction:column;
    }

    .product-card img{
      width:100%;
      height:220px;
      object-fit:cover;
      display:block;
      margin:0;
    }

    .card-body{
      padding:14px;
    }

    .card-title{
      font-size:18px;
      font-weight:700;
      margin-bottom:10px;
      line-height:1.3;
    }

    .card-meta{
      font-size:14px;
      margin-bottom:6px;
    }

    .card-link{
      display:inline-block;
      margin-top:10px;
      text-decoration:none;
      color:#1d4ed8;
      font-weight:600;
    }

    .predicted{
      font-size:20px;
      font-weight:700;
      margin:18px 0 10px;
    }
  </style>
</head>
<body>
  <div class="top-box">
    <h1>Sougui Scan Demo</h1>
    <p>Take a photo and get matching Sougui products back.</p>

    <input id="photo" type="file" accept="image/*" capture="environment">
    <img id="preview" style="display:none" alt="preview">

    <div style="margin:1rem 0">
      <button id="sendBtn">Scan product</button>
    </div>

    <div id="status"></div>
  </div>

  <div id="results"></div>

  <script>
    const WEBHOOK_URL = "http://127.0.0.1:8000/match_live";

    const fileInput = document.getElementById("photo");
    const preview = document.getElementById("preview");
    const sendBtn = document.getElementById("sendBtn");
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");

    fileInput.addEventListener("change", () => {
      const f = fileInput.files[0];
      if (!f) return;
      preview.src = URL.createObjectURL(f);
      preview.style.display = "block";
      resultsEl.innerHTML = "";
      statusEl.textContent = "";
    });

    sendBtn.addEventListener("click", async () => {
      const f = fileInput.files[0];
      if (!f) {
        statusEl.textContent = "Choose an image first.";
        return;
      }

      statusEl.textContent = "Uploading...";
      resultsEl.innerHTML = "";

      try {
        const formData = new FormData();
        formData.append("image", f, f.name);

        const res = await fetch(WEBHOOK_URL, {
          method: "POST",
          body: formData
        });

        const data = await res.json();
        statusEl.textContent = "Done.";

        const predictedCategory = data.predicted_category || "Unknown";
        const matches = Array.isArray(data.matches) ? data.matches : [];

        let html = `<div class="predicted">Predicted category: ${predictedCategory}</div>`;

        if (!matches.length) {
          html += "<p>No matches returned.</p>";
          resultsEl.innerHTML = html;
          return;
        }

        html += `<div class="results-grid">`;
        html += matches.map((m, i) => `
          <div class="product-card">
            <img src="${m.image_url || ''}" alt="${m.product_name || 'product'}">
            <div class="card-body">
              <div class="card-title">#${i + 1} ${m.product_name}</div>
              <div class="card-meta"><strong>Category:</strong> ${m.main_category || ""}${m.subcategory ? " / " + m.subcategory : ""}</div>
              <div class="card-meta"><strong>Score:</strong> ${typeof m.score === "number" ? m.score.toFixed(4) : m.score}</div>
              <a class="card-link" href="${m.product_url}" target="_blank" rel="noopener noreferrer">Open on Sougui</a>
            </div>
          </div>
        `).join("");
        html += `</div>`;

        resultsEl.innerHTML = html;

      } catch (err) {
        statusEl.textContent = "Error: " + err.message;
      }
    });
  </script>
</body>
</html>
